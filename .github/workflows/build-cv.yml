name: Build CV

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # move the "latest" tag and update the release
  pages: write     # GitHub Pages deploy
  id-token: write  # required by deploy-pages

concurrency:
  group: build-cv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS runner: Optima ships with macOS and isn't available on Linux runners.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Tectonic
        run: brew install tectonic

      - name: Compile
        run: tectonic phillips_cv.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          path: phillips_cv.pdf
          archive: false  # plain PDF download, not a zip
          retention-days: 7

      - name: Publish to "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest CV" --latest \
              --notes "Built automatically from master."
          gh release upload latest phillips_cv.pdf --clobber

      - name: Stage GitHub Pages site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p site
          cp phillips_cv.pdf site/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Zack Phillips CV</title>
          <meta http-equiv="refresh" content="0; url=phillips_cv.pdf">
          <a href="phillips_cv.pdf">phillips_cv.pdf</a>
          HTML

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-pages:
    # Serves the PDF inline (release assets download as attachments).
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}phillips_cv.pdf
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
